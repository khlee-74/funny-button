<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>절대 누르지 마시오</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            overflow: hidden;
            transition: background-color 0.3s;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 420px;
            width: 90%;
        }
        .counter {
            font-size: 1.1rem;
            color: #888888;
            margin-bottom: 30px;
            min-height: 24px;
        }
        .msg-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #f1f1f1;
            word-break: keep-all;
        }
        .btn-wrapper {
            position: relative;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .magic-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff4b4b, #dc3545);
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.5);
            cursor: pointer;
            outline: none;
            transition: transform 0.15s ease, background 0.3s;
        }
        .magic-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="counter" id="counterText">누른 횟수: 0</div>
    <div class="msg-box" id="msgBox">절대로 아래 버튼을 누르지 마세요.</div>
    
    <div class="btn-wrapper">
        <button class="magic-btn" id="btn" onclick="handleClick()">누르지마</button>
    </div>
</div>

    // Web Audio 효과음
    function playBeep(freq = 440, type = 'sine', duration = 0.12) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function handleClick() {
        count++;
        counterText.innerText = `누른 횟수: ${count}`;
        
        // 클릭 시 톤이 높아지는 피치 효과음
        playBeep(250 + (count * 5) % 400, 'triangle', 0.1);

        if (count <= 100) {
            msgBox.innerText = messages[count - 1];
        } else {
            // 101번째부터 지정 문구 출력
            msgBox.innerText = "이렇게 까지 누를 줄이야... 더 이상 새로운 메시지는 나오지 않습니다.";
            btn.style.background = "linear-gradient(145deg, #6c757d, #495057)";
            btn.innerText = "끝!";
        }

        // 10번 단위로 시각 효과 연출
        if (count % 10 === 0 && count <= 100) {
            document.body.style.backgroundColor = '#1e1e2f';
            setTimeout(() => document.body.style.backgroundColor = '#121212', 300);
        }

        // 버튼 회전 효과
        if (count % 15 === 0 && count <= 100) {
            btn.style.transform = 'rotate(180deg)';
            setTimeout(() => btn.style.transform = 'rotate(0deg)', 300);
        }
    }
</script>
